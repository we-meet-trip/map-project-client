# gitleaks 설정: 기본 규칙에 오탐 하나만 허용한다.
[extend]
useDefault = true

[[allowlists]]
description = "CocoaPods SPEC CHECKSUMS in Podfile.lock are package hashes, not secrets"
condition = "AND"
paths = ['''(^|/)ios/Podfile\.lock$''']
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_.+-]+: [0-9a-f]{40}$''']

# 코드를 밀 때마다 시험과 정적 분석만 돌린다. 비밀값이 필요 없고, 설치본을
# 만들거나 게시하지 않는다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: iOS build guard tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: test
        run: flutter test

      - name: production environment isolation
        run: flutter test test/core/app_environment_prod_test.dart --dart-define=APP_ENV=prod

      - name: analyze
        run: flutter analyze
